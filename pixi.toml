[workspace]
name = "nf-helper"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
nextflow = "26.04.*"
python = "3.12.*"

[tasks]
test-python = "python -m unittest discover -s tests"
test-shell-syntax = "bash tests/test_helper_syntax.sh"
test-cleanup = "bash tests/test_cleanup_processed_sample_workdirs.sh"
test-viper-config = "HOSTNAME=viper05i NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow -c conf/sites/viper-cpu.config config -profile viper-cpu"
test = { depends-on = ["test-python", "test-shell-syntax", "test-cleanup", "test-viper-config"] }
