[workspace]
name = "nf-helper"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
nextflow = "26.04.*"
python = "3.12.*"

[tasks]
test-python = "python -m unittest discover -s tests"
test-shell-syntax = "bash tests/test_helper_syntax.sh"
test-cleanup = "bash tests/test_cleanup_processed_sample_workdirs.sh"
test-viper-config-runtime-host = "HOSTNAME=viper05 NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow -c conf/sites/viper-cpu.config config -profile viper-cpu >/dev/null"
test-viper-config-dns-host = "HOSTNAME=viper05i NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow -c conf/sites/viper-cpu.config config -profile viper-cpu >/dev/null"
test-viper-config-rejects-other-host = "bash -c 'if HOSTNAME=viper04 NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow -c conf/sites/viper-cpu.config config -profile viper-cpu >/dev/null 2>&1; then exit 1; fi'"
test-raven-config-runtime-host = "HOSTNAME=raven03 NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow -c conf/sites/raven.config config -profile raven >/dev/null"
test-raven-config-dns-host = "HOSTNAME=raven03i NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow -c conf/sites/raven.config config -profile raven >/dev/null"
test-raven-config-rejects-other-host = "bash -c 'if HOSTNAME=raven05 NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow -c conf/sites/raven.config config -profile raven >/dev/null 2>&1; then exit 1; fi'"
test-raven-valid-gpu-request = "HOSTNAME=raven03 NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow run tests/empty_workflow.nf -c conf/sites/raven.config -profile raven --gpus 2 --raven_gpu_constraint gpu-bw >/dev/null"
test-raven-rejects-invalid-gpus = "bash -c 'if HOSTNAME=raven03 NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow run tests/empty_workflow.nf -c conf/sites/raven.config -profile raven --gpus 3 >/dev/null 2>&1; then exit 1; fi'"
test-raven-rejects-invalid-gpu-constraint = "bash -c 'if HOSTNAME=raven03 NXF_APPTAINER_CACHEDIR=/ptmp/pixi-test/apptainer-cache NXF_SYNTAX_PARSER=v2 nextflow run tests/empty_workflow.nf -c conf/sites/raven.config -profile raven --raven_gpu_constraint invalid >/dev/null 2>&1; then exit 1; fi'"
test = { depends-on = ["test-python", "test-shell-syntax", "test-cleanup", "test-viper-config-runtime-host", "test-viper-config-dns-host", "test-viper-config-rejects-other-host", "test-raven-config-runtime-host", "test-raven-config-dns-host", "test-raven-config-rejects-other-host", "test-raven-valid-gpu-request", "test-raven-rejects-invalid-gpus", "test-raven-rejects-invalid-gpu-constraint"] }
